nodes:
  - id: mouse-teleop
    build: pip install -e nodes/dora-openarm-mouse-teleop
    path: dora-openarm-mouse-teleop
    inputs:
      tick: dora/timer/millis/20
      pose_right: fk/pose_right
      pose_left: fk/pose_left
    outputs:
      - target_right
      - target_left
      - status
      - button_x

  - id: ik
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--tick-hz 50 --limit-velocity"
    inputs:
      target_right: mouse-teleop/target_right
      target_left: mouse-teleop/target_left
    outputs:
      - position_right
      - position_left

  - id: fk
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-fk
    inputs:
      position_right: mujoco-collect/position_right
      position_left: mujoco-collect/position_left
    outputs:
      - pose_right
      - pose_left

  - id: mujoco-collect
    build: pip install -e nodes/dora-openarm-mujoco
    path: ./mujoco_mac.sh
    args: "--scene demo --keyframe home --enable-collision --ctrl --viewer --render"
    inputs:
      move_position_right: ik/position_right
      move_position_left: ik/position_left
      request_position: dora/timer/millis/20
      button_x: mouse-teleop/button_x

    outputs:
      - status
      - position_right
      - position_left